<h1 class="auth-title">{{ 'Welcome back' | t }}</h1>
<p class="auth-subtitle">{{ 'Sign in to continue to Wasla.' | t }}</p>

<form [formGroup]="form" (ngSubmit)="submit()" novalidate>
  <div class="field">
    <label class="field__label" for="email">{{ 'Email' | t }}</label>
    <input id="email" class="field__input" type="email" formControlName="email"
           autocomplete="email" inputmode="email" placeholder="you@example.com"
           [class.is-invalid]="hasError('email')" />
    <span *ngIf="hasError('email')" class="field__error">
      {{ (form.controls.email.hasError('required') ? 'Email is required.' : 'Enter a valid email address.') | t }}
    </span>
  </div>

  <div class="field">
    <label class="field__label" for="password">{{ 'Password' | t }}</label>
    <div class="field__control">
      <input id="password" class="field__input field__input--has-toggle"
             [type]="showPassword() ? 'text' : 'password'" formControlName="password"
             autocomplete="current-password" [class.is-invalid]="hasError('password')" />
      <button type="button" class="field__toggle" (click)="showPassword.set(!showPassword())">
        {{ (showPassword() ? 'Hide' : 'Show') | t }}
      </button>
    </div>
    <span *ngIf="hasError('password')" class="field__error">{{ 'Password is required.' | t }}</span>
  </div>

  <button class="btn btn--primary" type="submit" [disabled]="loading()">
    <span *ngIf="loading()" class="spinner"></span>
    {{ 'Sign in' | t }}
  </button>
</form>

<p class="auth-switch">
  {{ 'New to Wasla?' | t }}
  <a class="link" routerLink="/auth/signup">{{ 'Create an account' | t }}</a>
</p>
