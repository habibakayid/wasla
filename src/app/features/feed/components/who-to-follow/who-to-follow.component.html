<div *ngIf="users().length > 0"
     class="bg-white dark:bg-neutral-800 border border-gray-200 dark:border-neutral-700 rounded-xl p-4 mb-4">
  <h2 class="font-semibold mb-3">{{ 'Who to follow' | t }}</h2>

  <div class="flex gap-4 overflow-x-auto pb-1">
    <div *ngFor="let user of users()" class="flex flex-col items-center shrink-0 w-16">
      <span class="relative">
        
        <a [routerLink]="['/profile', user._id]">
          <img [src]="user.photo" alt=""
               class="w-14 h-14 rounded-full object-cover border-2 bg-brand"
               [ngClass]="user.followed ? 'border-green-500' : 'border-rose'" />
        </a>
        
        <button type="button" (click)="follow(user)"
                class="absolute -bottom-1 -end-1 w-5 h-5 rounded-full text-white text-[10px] flex items-center justify-center"
                [ngClass]="user.followed ? 'bg-green-500' : 'bg-rose'"
                [attr.aria-label]="(user.followed ? 'Following' : 'Follow') | t">
          <i class="fa-solid" [ngClass]="user.followed ? 'fa-check' : 'fa-plus'"></i>
        </button>
      </span>
      <a [routerLink]="['/profile', user._id]" class="mt-1 text-xs truncate w-full text-center">{{ firstName(user.name) }}</a>
    </div>
  </div>
</div>
