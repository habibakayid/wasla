<article class="bg-white dark:bg-neutral-800 border border-gray-200 dark:border-neutral-700 rounded-xl shadow-sm">

  
  <div class="flex items-center gap-3 p-4">
    <img [src]="post().user.photo" alt="" class="w-10 h-10 rounded-full object-cover" />
    <div class="flex-1 min-w-0">
      <p class="font-semibold truncate">
        {{ post().user.name }}
        <span *ngIf="post().isShare" class="text-xs font-normal text-gray-500">shared a post</span>
      </p>
      <p class="text-xs text-gray-500 dark:text-gray-400 truncate">
        &#64;{{ post().user.username }} · {{ post().createdAt | date: 'medium' }}
      </p>
    </div>

   
    <div *ngIf="isMine() && !isEditing()" class="relative">
      <button type="button" (click)="menuOpen.set(!menuOpen())"
              class="px-2 py-1 rounded hover:bg-gray-100 dark:hover:bg-neutral-700" aria-label="More"><i class="fa-solid fa-ellipsis"></i></button>
      <div *ngIf="menuOpen()"
           class="absolute end-0 mt-1 w-32 z-10 bg-white dark:bg-neutral-700 border border-gray-200 dark:border-neutral-600 rounded-lg shadow text-sm">
        <button type="button" (click)="startEdit(); menuOpen.set(false)"
                class="block w-full text-start px-3 py-2 hover:bg-gray-100 dark:hover:bg-neutral-600">Edit</button>
        <button type="button" (click)="deletePost(); menuOpen.set(false)"
                class="block w-full text-start px-3 py-2 text-red-600 hover:bg-gray-100 dark:hover:bg-neutral-600">Delete</button>
      </div>
    </div>
  </div>

  
  <p *ngIf="!isEditing() && post().body" class="px-4 pb-3 text-sm whitespace-pre-line"><span
      *ngFor="let w of words()"
      [class.text-rose]="w.startsWith('#') || w.startsWith('@')"
      [class.font-medium]="w.startsWith('#') || w.startsWith('@')">{{ w }}</span></p>

 
  <div *ngIf="isEditing()" class="px-4 pb-3">
    <textarea [(ngModel)]="editText" rows="3"
              class="block w-full text-sm bg-gray-50 dark:bg-neutral-700 border border-gray-300 dark:border-neutral-600 rounded-lg focus:ring-brand focus:border-brand"></textarea>
    <div class="flex gap-2 mt-2">
      <button type="button" (click)="saveEdit()" class="text-xs text-white bg-brand hover:bg-brand-strong px-3 py-1.5 rounded-lg">Save</button>
      <button type="button" (click)="cancelEdit()" class="text-xs px-3 py-1.5 rounded-lg border border-gray-300 dark:border-neutral-600">Cancel</button>
    </div>
  </div>

  
  <div *ngIf="post().isShare && post().sharedPost as shared"
       class="mx-4 mb-3 border border-gray-200 dark:border-neutral-600 rounded-lg p-3">
    <div class="flex items-center gap-2 mb-2">
      <img [src]="shared.user.photo" alt="" class="w-7 h-7 rounded-full object-cover" />
      <p class="text-sm font-semibold">{{ shared.user.name }}</p>
      <p class="text-xs text-gray-500">&#64;{{ shared.user.username }}</p>
    </div>
    <p class="text-sm whitespace-pre-line">{{ shared.body }}</p>
    <img *ngIf="shared.image" [src]="shared.image" alt="" class="mt-2 w-full max-h-72 object-cover rounded-lg" />
  </div>

  
  <img *ngIf="post().image" [src]="post().image" alt="" class="w-full max-h-[28rem] object-cover" />

  
  <div class="flex items-center gap-1 px-2 py-2 border-t border-gray-200 dark:border-neutral-700 text-sm">

    
    <button type="button" (click)="toggleLike()"
            class="flex items-center gap-1.5 px-3 py-2 rounded-lg hover:bg-gray-100 dark:hover:bg-neutral-700"
            [ngClass]="isLiked() ? 'text-rose' : 'text-gray-600 dark:text-gray-300'">
      <i class="fa-heart" [ngClass]="isLiked() ? 'fa-solid' : 'fa-regular'"></i>
      {{ post().likesCount }} Likes
    </button>

   
    <a [routerLink]="['/posts', post()._id]"
       class="flex items-center gap-1.5 px-3 py-2 rounded-lg hover:bg-gray-100 dark:hover:bg-neutral-700 text-gray-600 dark:text-gray-300">
      <i class="fa-regular fa-comment"></i> {{ post().commentsCount }} Comments
    </a>

    
    <button type="button" (click)="share()"
            class="flex items-center gap-1.5 px-3 py-2 rounded-lg hover:bg-gray-100 dark:hover:bg-neutral-700 text-gray-600 dark:text-gray-300">
      <i class="fa-solid fa-retweet"></i> {{ post().sharesCount }} Share
    </button>

   
    <button type="button" (click)="toggleBookmark()"
            class="ms-auto flex items-center gap-1.5 px-3 py-2 rounded-lg hover:bg-gray-100 dark:hover:bg-neutral-700"
            [ngClass]="post().bookmarked ? 'text-gold' : 'text-gray-600 dark:text-gray-300'" aria-label="Bookmark">
      <i class="fa-bookmark" [ngClass]="post().bookmarked ? 'fa-solid' : 'fa-regular'"></i>
      <span class="hidden sm:inline">Bookmark</span>
    </button>
  </div>

  
  <div *ngIf="post().topComment as top" class="flex gap-2 px-4 py-3 border-t border-gray-100 dark:border-neutral-700">
    <img [src]="top.commentCreator.photo" alt="" class="w-7 h-7 rounded-full object-cover" />
    <div class="bg-gray-100 dark:bg-neutral-700 rounded-2xl px-3 py-1.5 text-sm min-w-0">
      <p class="text-xs font-semibold">{{ top.commentCreator.name }}</p>
      <p class="truncate">{{ top.content }}</p>
    </div>
  </div>
</article>
