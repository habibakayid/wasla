<h1 class="text-xl font-extrabold mb-4">{{ 'Explore' | t }}</h1>

<p *ngIf="loading() && posts().length === 0" class="text-sm text-gray-500">{{ 'Loading...' | t }}</p>

<div *ngIf="!loading() && posts().length === 0"
     class="text-center bg-white dark:bg-neutral-800 border border-gray-200 dark:border-neutral-700 rounded-xl p-10">
  <p class="text-3xl mb-2 text-gray-400"><i class="fa-regular fa-compass"></i></p>
  <p class="font-semibold">{{ 'Nothing to explore yet' | t }}</p>
</div>

<div class="space-y-4">
  <app-post-card *ngFor="let post of posts(); trackBy: trackById" [post]="post" (postChange)="replacePost($event)" (deleted)="removePost($event)" />
</div>

<div [appInfiniteScroll]="hasMore() && !loading()" (reached)="loadMore()" class="h-4"></div>

<p *ngIf="loading() && posts().length > 0" class="text-center text-sm text-gray-500 py-4">
  <i class="fa-solid fa-spinner fa-spin"></i> {{ 'Loading...' | t }}
</p>
<p *ngIf="!hasMore() && posts().length > 0" class="text-center text-xs text-gray-400 py-4">{{ 'You\'re all caught up' | t }}</p>
